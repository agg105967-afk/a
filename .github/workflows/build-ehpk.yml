# GitHub 上で topics-hud.ehpk を作る（PC不要）。
# 使い方: Actions タブ → 「Build EHPK」→ Run workflow
# できあがりは2か所に置かれる:
#   1) Artifacts の topics-hud-ehpk（zip）
#   2) ブランチ ehpk の topics-hud.ehpk（zipなしでそのままダウンロード可）
name: Build EHPK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Even Hub CLI
        run: npm install -g @evenrealities/evenhub-cli

      # 型チェック → ビルド → evenhub pack（package.json の pack スクリプト）
      - name: Build and pack
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: topics-hud-ehpk
          path: topics-hud.ehpk
          if-no-files-found: error

      - name: Publish .ehpk to the ehpk branch
        run: |
          out="$(mktemp -d)"
          cp topics-hud.ehpk "$out/"
          cd "$out"
          git init -q -b ehpk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics-hud.ehpk
          git commit -q -m "Build topics-hud.ehpk from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ehpk
